HELLO:
  HRU:
    actions:
      - { func: tts, args: ["Здравствуйте, {user}!"] }
      - { func: tts, args: ["Как ваши дела?"] }
  TIME:
    actions:
      - { func: tts, args: ["Сейчас {time}"] }
  actions:
    - { func: reply, args: ["GREETINGS"] }

TIME:
    actions:
      - { func: tts, args: ["Сейчас {time}"] }

SAY:
  <ARG>:
    actions:
      - { func: tts, args: ["{0}"] }

OPEN:
  BROWSER:
    actions:
      - { func: launch_app, args: ["{browser}"] }
  YOUTUBE:
    actions:
      - { func: open_url, args: ["{youtube}"] }
  GITHUB:
    actions:
      - { func: open_url, args: ["{github}"] }
  TIMER:
    FOR:
      <ARG>:
          actions:
            - { func: start_timer, args: ["{0}"] }
    <ARG>:
      actions:
        - { func: start_timer, args: ["{0}"] }

RANDOM_NUMBER:
  FROM:
    <ARG>:
      TO:
        <ARG>:
          actions:
            - { func: random_number, args: ["{0}", "{1}"] }

THX:
  actions:
    - { func: tts, args: ["Пожалуйста! Всегда рада помочь!"] }
    
ME_HRU:
  actions:
    - { func: tts, args: ["У меня все в порядке, работаю и жду ваших команд!"] }
    
I_LOVE_YOU:
  actions:
    - { func: tts, args: ["Мне очень приятно, {user}. Я вас тоже ценю!"] }

JOKE:
  actions:
    - { func: tts, args: ["С удовольствием!"] }
    - { func: get_joke, args: [] }

SEARCH:
  <ARG>:
    actions:
      - { func: tts, args: ["Сейчас поищу в интернете: {0}"] }
      - { func: search, args: ["{0}"] }

WHAT_IS:
  <ARG>:
    actions:
      - { func: tts, args: ["Давайте узнаем, что это такое."] }
      - { func: search, args: ["{0}"] }

WEATHER:
  actions:
    - { func: tts, args: ["Ищу информацию о погоде."] }
    - { func: search_web, args: ["погода сейчас"] }
  <ARG>:
    actions:
    - { func: tts, args: ["Ищу погоду в городе {0}"] }
    - { func: search_web, args: ["погода в {0}"] }

CALCULATE:
  <ARG>:
    actions:
      - { func: tts, args: ["Результат вычисления:"] }
      - { func: calculate, args: ["{0}"], convert_digits: true }